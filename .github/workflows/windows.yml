name: windows

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
        working-directory: app
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install (numpy, playwright for UI tests)
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy playwright
          python -m playwright install chromium
          $chrome = python -c "from playwright.sync_api import sync_playwright as s; p=s().start(); print(p.chromium.executable_path); p.stop()"
          "MALIGN_CHROMIUM=$chrome" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: All tests (Windows, Python)
        run: |
          $failed = @()
          Get-ChildItem tests -Filter 'test_*.py' | Sort-Object Name | ForEach-Object {
            Write-Host "=== $($_.Name)"
            python $_.FullName 2>&1 | Tee-Object -FilePath "test_$($_.BaseName).log" | Select-Object -Last 3
            if ($LASTEXITCODE -ne 0) { $failed += $_.Name }
          }
          if ($failed.Count) { Write-Host "FAILED: $failed"; exit 1 }
      - name: Alignment audit (yard follows the kit pipeline)
        run: python tools/audit_yard_alignment.py 10 audit_yard_alignment.json
      - name: Smoke (python) + 3D screenshot on Windows Chromium
        run: python tools/windows_smoke.py --shot yard_windows.png --tasks 2
      - name: Build EXE with the user's BUILD_EXE.cmd
        shell: cmd
        run: cmd /c "BUILD_EXE.cmd < NUL" && if not exist dist\MALIGN_Desktop.exe exit /b 1
      - name: Smoke the built EXE
        run: python tools/windows_smoke.py --exe dist/MALIGN_Desktop.exe --tasks 2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: MALIGN_Desktop_windows
          path: |
            app/dist/MALIGN_Desktop.exe
            app/yard_windows.png
            app/audit_yard_alignment.json
            app/test_*.log
          if-no-files-found: warn
