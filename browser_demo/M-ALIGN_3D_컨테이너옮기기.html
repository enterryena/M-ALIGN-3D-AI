<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>M-ALIGN 3D · 컨테이너 옮기기</title>
<style>
:root{--ink:#e9f1f6;--muted:#9fb3c2;--panel:rgba(14,24,33,.82);--line:rgba(255,255,255,.12);--ok:#3ddc97;--bad:#ff5d5d;--warn:#ffc04d}
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#a9c6d9;font-family:"Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;color:var(--ink)}
canvas#scene{display:block;width:100vw;height:100vh;touch-action:none}
.panel{position:absolute;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
#ctrl{left:10px;top:10px;width:250px}#ctrl h1{font-size:15px;margin:0 0 6px}#ctrl label{display:block;font-size:11px;color:var(--muted);margin:6px 0 3px}
#ctrl select,#ctrl input[type=text],#ctrl input:not([type]){width:100%;background:#0d1720;color:var(--ink);border:1px solid var(--line);border-radius:7px;padding:5px 7px;font-size:12px}
.row{display:flex;gap:6px}.row>*{flex:1}
button{background:#1d2c38;color:#fff;border:1px solid var(--line);border-radius:8px;padding:7px;font-size:12px;cursor:pointer;width:100%;margin-top:6px}
button:disabled{opacity:.45}
.chk{display:flex!important;align-items:center;gap:6px;color:var(--ink)!important;font-size:12px!important}
#status{left:50%;top:10px;transform:translateX(-50%);text-align:center;min-width:300px;max-width:60vw}
#stage{font-size:16px;font-weight:700}#sub{font-size:12px;color:var(--muted);margin-top:3px}
#banner{position:absolute;left:50%;top:84px;transform:translateX(-50%);font-size:20px;font-weight:800;padding:8px 18px;border-radius:12px;display:none;color:#0b1218}
#corners{right:10px;top:10px;width:250px}#corners h2,#log h2{font-size:13px;margin:0 0 6px}
.cgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px}.c{background:#0d1720;border-radius:8px;padding:6px 8px;border:1px solid var(--line)}
.c b{font-size:11px;color:var(--muted);font-weight:500}.c div{font-size:17px;font-weight:700;margin-top:2px}.c small{font-size:10px;color:var(--muted)}
#log{right:10px;bottom:10px;width:380px;max-height:36vh;display:flex;flex-direction:column}#logbody{overflow:auto;font-size:12px;line-height:1.5}
.l{padding:2px 0;border-bottom:1px dashed rgba(255,255,255,.06)}.who{display:inline-block;min-width:44px;font-weight:700;margin-right:6px}
.w-사용자{color:#46c7ff}.w-서버{color:var(--warn)}.w-키트{color:#5fe1d0}.w-기계{color:#ffd27a}
#help{left:10px;bottom:10px;font-size:11px;color:var(--muted);max-width:330px}
@media(max-width:820px){#ctrl{width:190px}#corners{display:none}#log{width:calc(100vw - 20px);max-height:24vh}#help{display:none}#status{max-width:none;min-width:0;left:210px;transform:none;right:10px}}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"}}</script>
</head>
<body>
<canvas id="scene"></canvas>
<div class="panel" id="ctrl">
 <h1>M-ALIGN 3D · 컨테이너 옮기기</h1>
 <div style="font-size:11px;color:var(--muted)">반투명 컨테이너를 원하는 곳에 두고 클릭 → 리치스태커가 가서 키트로 정렬·결합한 뒤 옮겨 놓습니다.</div>
 <div class="row"><button id="rotL">⟲ 회전</button><button id="rotR">⟳ 회전</button></div>
 <label for="hardware">키트 하드웨어</label>
 <select id="hardware"><option value="target">목표 사양</option><option value="base">기준 가정 (오차 큼)</option><option value="ideal">이상적</option></select>
 <div class="row"><div><label for="speed">속도</label><select id="speed"><option value="0.6">느리게</option><option value="1" selected>보통</option><option value="2">빠르게</option></select></div>
 <div><label for="seed">시드</label><input id="seed" placeholder="무작위"></div></div>
 <label class="chk"><input type="checkbox" id="exag" checked> 정렬 오차 30배 확대</label>
 <label class="chk"><input type="checkbox" id="follow"> 카메라가 스프레더 따라가기</label>
 <div class="row"><button id="camAll">전체 보기</button><button id="camNear">가까이</button></div>
</div>
<div class="panel" id="status"><div id="stage">불러오는 중…</div><div id="sub"></div></div>
<div id="banner"></div>
<div class="panel" id="corners"><h2>코너 정렬 오차 (실제)</h2><div class="cgrid" id="cgrid"></div>
 <div style="font-size:10px;color:var(--muted);margin-top:6px">성공 조건: 네 코너 모두 5 mm 이내에서 결합. 하강은 예상 최악 코너 4 mm 이하일 때만.</div></div>
<div class="panel" id="log"><h2>작업 기록</h2><div id="logbody"></div></div>
<div class="panel" id="help">마우스: 왼쪽 클릭 = 이곳으로 옮겨 · 끌기 = 화면 회전 · 휠 = 확대 · R/E = 방향 회전. 노란 선 = 야드 경계.<br>시뮬레이션이며 실제 장비 성능이 아닙니다 (Maxwell FEM 21케이스 기반).</div>
<script>/* ORIGINAL MATRIX5 ENGINE, UNMODIFIED */


/* M-ALIGN Matrix5 engine (v2.0). Pure functions, no DOM. Runs in browser and node.
   Truth model and controller model are both built from the 21 Maxwell cases (v1.5.11 + v1.5.12). */
(function (root) {
  'use strict';
  var HEADS = ['Xp', 'Xm', 'Yp', 'Ym', 'Ref'];

  // ---------- deterministic RNG ----------
  function rng(seed) {
    var s = (seed >>> 0) || 1;
    var r = function () { s ^= s << 13; s >>>= 0; s ^= s >>> 17; s ^= s << 5; s >>>= 0; return s / 4294967296; };
    r.n = function () { var u = 0, v = 0; while (u === 0) u = r(); v = r(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); };
    return r;
  }

  // ---------- PCHIP (Fritsch-Carlson), held flat outside the data ----------
  function pchip(xs, ys) {
    var n = xs.length, h = [], d = [], m = new Array(n), i;
    for (i = 0; i < n - 1; i++) { h[i] = xs[i + 1] - xs[i]; d[i] = (ys[i + 1] - ys[i]) / h[i]; }
    m[0] = d[0]; m[n - 1] = d[n - 2];
    for (i = 1; i < n - 1; i++) {
      if (d[i - 1] * d[i] <= 0) m[i] = 0;
      else { var w1 = 2 * h[i] + h[i - 1], w2 = h[i] + 2 * h[i - 1]; m[i] = (w1 + w2) / (w1 / d[i - 1] + w2 / d[i]); }
    }
    return function (x) {
      if (x <= xs[0]) return ys[0];
      if (x >= xs[n - 1]) return ys[n - 1];
      var k = 0; while (x > xs[k + 1]) k++;
      var t = (x - xs[k]) / h[k], t2 = t * t, t3 = t2 * t;
      return (2 * t3 - 3 * t2 + 1) * ys[k] + (t3 - 2 * t2 + t) * h[k] * m[k] + (-2 * t3 + 3 * t2) * ys[k + 1] + (t3 - t2) * h[k] * m[k + 1];
    };
  }

  // ---------- build the response model from the case data ----------
  function buildModel(data) {
    var C = data.cases, L0 = C.P1_center.L;
    function dL(id) { return C[id].L.map(function (v, i) { return v - L0[i]; }); }
    var zero = [0, 0, 0, 0, 0];
    var xs = [-30, -15, -5, 0, 5, 15, 30];
    var xRows = [dL('P5_xm30'), dL('P5_xm15'), dL('P2_xm5'), zero, dL('P2_xp5'), dL('P5_xp15'), dL('P5_xp30')];
    var y5m = dL('P2_ym5'), y5 = dL('P2_yp5'), y15 = dL('P5_yp15'), y30 = dL('P5_yp30');
    // y < -5: mirror about y=0 (Yp<->Ym swap, Xp/Xm unchanged). Ref (at +x,+y) has no mirror partner: held at its -5 mm value (ASSUMED).
    function mir(r) { return [r[0], r[1], r[3], r[2], y5m[4]]; }
    var yRows = [mir(y30), mir(y15), y5m, zero, y5, y15, y30];
    var fx = [], fy = [], h;
    for (h = 0; h < 5; h++) {
      fx.push(pchip(xs, xRows.map(function (r) { return r[h]; })));
      fy.push(pchip(xs, yRows.map(function (r) { return r[h]; })));
    }
    // x*y interaction from the (30,30) case
    var d33 = dL('P1_offaxis_30_30'), cxy = [];
    for (h = 0; h < 5; h++) cxy.push((d33[h] - fx[h](30) - fy[h](30)) / 900);
    // gap: dz -2, 0, +2, +20 (gap 18, 20, 22, 40 mm)
    var gz = [], g18 = dL('P4_gap18'), g22 = dL('P4_gap22'), g40 = dL('P6_gap40'), gslope = [];
    for (h = 0; h < 5; h++) { gz.push(pchip([-2, 0, 2, 20], [g18[h], 0, g22[h], g40[h]])); gslope.push((g22[h] - g18[h]) / 4); }
    var kp = dL('P4_pitch_p1'), kr = dL('P4_roll_p1'); // per +1 deg, assumed odd-linear
    function resp(x, y, out) {
      for (var k = 0; k < 5; k++) out[k] = fx[k](x) + fy[k](y) + cxy[k] * x * y;
      return out;
    }
    // tabulate on a 0.5 mm grid, +-40 mm
    var R = 40, S = 0.5, N = Math.round(2 * R / S) + 1, tab = [];
    var tmp = [0, 0, 0, 0, 0];
    for (h = 0; h < 5; h++) tab.push(new Float64Array(N * N));
    // Same response formula and 0.5-mm grid as the original v2.0.
    // Cache axis evaluations to avoid recalculating PCHIP at all 25,921 nodes.
    var ax = [], ay = [];
    for (h = 0; h < 5; h++) {
      ax.push(new Float64Array(N)); ay.push(new Float64Array(N));
      for (var ix = 0; ix < N; ix++) ax[h][ix] = fx[h](-R + ix * S);
      for (var iy = 0; iy < N; iy++) ay[h][iy] = fy[h](-R + iy * S);
    }
    for (var i = 0; i < N; i++) for (var j = 0; j < N; j++) {
      var x = -R + i * S, y = -R + j * S;
      for (h = 0; h < 5; h++) tab[h][i * N + j] = ax[h][i] + ay[h][j] + cxy[h] * x * y;
    }
    return { L0: L0, fx: fx, fy: fy, cxy: cxy, gz: gz, gslope: gslope, kp: kp, kr: kr, resp: resp, tab: tab, R: R, S: S, N: N, xs: xs };
  }

  // ---------- one corner: sensor reading (truth) ----------
  function measure(M, st, ex, ey, rnd, P, out) {
    // st: per-corner static state {dz, pitch, roll, bias[5]}; ex,ey local true error (mm)
    M.resp(ex, ey, out);
    for (var h = 0; h < 5; h++) {
      out[h] += M.gz[h](st.dz) + M.kp[h] * st.pitch + M.kr[h] * st.roll + st.bias[h] + P.noise * rnd.n();
    }
    return out;
  }

  // ---------- one corner: estimate (x,y[,dz]) from a reading ----------
  function estimate(M, meas, P) {
    var w = P.useHead, N = M.N, S = M.S, R = M.R, g = M.gslope, h;
    var gg = 0; for (h = 0; h < 5; h++) if (w[h]) gg += g[h] * g[h];
    function cost(idx) {
      var r = [0, 0, 0, 0, 0], gr = 0, c = 0;
      for (h = 0; h < 5; h++) if (w[h]) { r[h] = meas[h] - M.tab[h][idx]; gr += g[h] * r[h]; }
      var dz = 0;
      if (P.fitGap && gg > 0) { dz = gr / gg; if (dz > 3) dz = 3; if (dz < -3) dz = -3; }
      for (h = 0; h < 5; h++) if (w[h]) { var e = r[h] - g[h] * dz; c += e * e; }
      return c;
    }
    var lim = Math.round(P.searchMM / S), c0 = Math.round(R / S), best = 1e99, bi = c0, bj = c0, i, j, step = 4; // coarse 2 mm
    for (i = c0 - lim; i <= c0 + lim; i += step) for (j = c0 - lim; j <= c0 + lim; j += step) {
      var c = cost(i * N + j); if (c < best) { best = c; bi = i; bj = j; }
    }
    var fi = bi, fj = bj; // fine 0.5 mm, +-2.5 mm around the coarse best
    for (i = bi - 5; i <= bi + 5; i++) for (j = bj - 5; j <= bj + 5; j++) {
      if (i < 0 || j < 0 || i >= N || j >= N) continue;
      var c2 = cost(i * N + j); if (c2 < best) { best = c2; fi = i; fj = j; }
    }
    return { x: -R + fi * S, y: -R + fj * S, rss: best };
  }

  // ---------- 20 ft container, 4 corners ----------
  var CORNERS = [[-2926.5, 1129.5], [2926.5, 1129.5], [2926.5, -1129.5], [-2926.5, -1129.5]]; // twistlock centres (mm)
  function frame(k, mirror) { // local sensor frame sign per corner
    if (!mirror) return [1, 1];
    return [CORNERS[k][0] > 0 ? 1 : -1, CORNERS[k][1] > 0 ? 1 : -1];
  }

  function wilson(k, n) {
    if (!n) return [0, 0, 0];
    var z = 1.96, p = k / n, d = 1 + z * z / n, c = (p + z * z / (2 * n)) / d, hw = z * Math.sqrt(p * (1 - p) / n + z * z / (4 * n * n)) / d;
    return [p, Math.max(0, c - hw), Math.min(1, c + hw)];
  }

  // ---------- full 4-corner closed loop ----------
  function runOnce(M, P, rnd, keepTrace) {
    // initial rigid error of the spreader relative to the container (manual approach)
    var r0 = P.R0 * Math.sqrt(rnd()), a0 = 2 * Math.PI * rnd();
    var tx = r0 * Math.cos(a0), ty = r0 * Math.sin(a0), th = P.theta0 * Math.PI / 180 * rnd.n();
    var tol = [], st = [], k, h;
    for (k = 0; k < 4; k++) {
      tol.push([P.tolC * rnd.n(), P.tolC * rnd.n()]);
      var b = []; for (h = 0; h < 5; h++) b.push(P.modelBias * rnd.n());
      st.push({ dz: P.gapSd * rnd.n(), pitch: P.tiltSd * rnd.n(), roll: P.tiltSd * rnd.n(), bias: b });
    }
    function errs() { // global error of each corner = hole centre - twistlock axis
      var out = [];
      for (var q = 0; q < 4; q++) {
        var X = CORNERS[q][0], Y = CORNERS[q][1];
        out.push([tx - th * Y + tol[q][0], ty + th * X + tol[q][1]]);
      }
      return out;
    }
    var trace = keepTrace ? [] : null, meas = [0, 0, 0, 0, 0], extrap = false, it, e0 = errs();
    var historyByCorner = P.estimator === 'history' ? [[], [], [], []] : null;
    for (it = 0; it <= P.iters; it++) {
      var E = errs(), est = [];
      if (keepTrace) trace.push({ e: E.map(function (v) { return v.slice(); }), est: null, sensor_uH: [] });
      if (it === P.iters) break;
      for (k = 0; k < 4; k++) {
        var f = frame(k, P.mirror), lx = f[0] * E[k][0], ly = f[1] * E[k][1];
        if (Math.abs(lx) > 30 || Math.abs(ly) > 30) extrap = true;
        measure(M, st[k], lx, ly, rnd, P, meas);
        if (keepTrace) trace[trace.length - 1].sensor_uH.push(meas.slice());
        var es;
        if (historyByCorner) {
          var hst = historyByCorner[k];
          // Retain ONLY measured inductance and commanded local offsets. No true position.
          hst.push({m:meas.slice(), ox:0, oy:0});
          es = (hst.length >= 2 && root.MALIGN_HISTORY)
            ? root.MALIGN_HISTORY.estimate(M, hst, P, function(){ return estimate(M, meas, P); })
            : estimate(M, meas, P);
        } else {
          es = (P.estimator==='lm' && root.MALIGN_LM) ? root.MALIGN_LM.estimate(M,meas,P) : estimate(M,meas,P);
        }
        est.push([f[0] * es.x, f[1] * es.y]);
      }
      if (keepTrace) trace[trace.length - 1].est = est;
      // least-squares rigid fit (dx, dy, dtheta) of the 4 estimates
      var sx = 0, sy = 0, num = 0, den = 0;
      for (k = 0; k < 4; k++) { sx += est[k][0]; sy += est[k][1]; }
      sx /= 4; sy /= 4;
      for (k = 0; k < 4; k++) {
        var X2 = CORNERS[k][0], Y2 = CORNERS[k][1];
        num += X2 * (est[k][1] - sy) - Y2 * (est[k][0] - sx); den += X2 * X2 + Y2 * Y2;
      }
      var dth = num / den;
      // History offsets use only commanded X/Y/rotation, never hidden actuator errors.
      if (historyByCorner) {
        var cmdX=-P.K*sx, cmdY=-P.K*sy, cmdTh=-P.K*dth;
        for (k=0; k<4; k++) {
          var lf=frame(k,P.mirror), CX=CORNERS[k][0], CY=CORNERS[k][1];
          var deX=lf[0]*(cmdX-cmdTh*CY), deY=lf[1]*(cmdY+cmdTh*CX);
          for (var hi=0;hi<historyByCorner[k].length;hi++) {
            historyByCorner[k][hi].ox -= deX;
            historyByCorner[k][hi].oy -= deY;
          }
        }
      }
      // move the spreader (actuator error included)
      tx -= P.K * sx + P.act * rnd.n();
      ty -= P.K * sy + P.act * rnd.n();
      th -= P.K * dth;
      var small = true; for (k = 0; k < 4; k++) if (Math.abs(est[k][0]) > P.stopMM || Math.abs(est[k][1]) > P.stopMM) small = false;
      if (small) { if (keepTrace) trace.push({ e: errs(), est: null }); break; }
    }
    var EF = errs(), worst = 0, worst0 = 0;
    for (k = 0; k < 4; k++) {
      worst = Math.max(worst, Math.abs(EF[k][0]), Math.abs(EF[k][1]));
      worst0 = Math.max(worst0, Math.abs(e0[k][0]), Math.abs(e0[k][1]));
    }
    return { ok: worst <= P.tolMM, ok0: worst0 <= P.tolMM, worst: worst, worst0: worst0, steps: it, extrap: extrap, trace: trace };
  }

  function batch(M, P, n, seed) {
    var rnd = rng(seed), ok = 0, ok0 = 0, ex = 0, ws = [], steps = 0;
    for (var i = 0; i < n; i++) {
      var r = runOnce(M, P, rnd, false);
      if (r.ok) ok++; if (r.ok0) ok0++; if (r.extrap) ex++; ws.push(r.worst); steps += r.steps;
    }
    ws.sort(function (a, b) { return a - b; });
    return { n: n, ok: ok, ok0: ok0, extrap: ex, rate: wilson(ok, n), rate0: wilson(ok0, n), worst: ws,
             p50: ws[Math.floor(n * 0.5)], p95: ws[Math.floor(n * 0.95)], meanSteps: steps / n };
  }

  // single corner, no rotation / no tolerance: where does the loop capture?
  function captureMap(M, P, step, trials, seed) {
    var rnd = rng(seed), cells = [], meas = [0, 0, 0, 0, 0];
    for (var x = -30; x <= 30; x += step) for (var y = -30; y <= 30; y += step) {
      var ok = 0, fin = 0;
      for (var t = 0; t < trials; t++) {
        var b = []; for (var h = 0; h < 5; h++) b.push(P.modelBias * rnd.n());
        var st = { dz: P.gapSd * rnd.n(), pitch: P.tiltSd * rnd.n(), roll: P.tiltSd * rnd.n(), bias: b };
        var ex = x, ey = y;
        for (var it = 0; it < P.iters; it++) {
          measure(M, st, ex, ey, rnd, P, meas);
          var es = (P.estimator==='lm' && root.MALIGN_LM) ? root.MALIGN_LM.estimate(M,meas,P) : estimate(M,meas,P);
          ex -= P.K * es.x + P.act * rnd.n(); ey -= P.K * es.y + P.act * rnd.n();
          if (Math.abs(es.x) <= P.stopMM && Math.abs(es.y) <= P.stopMM) break;
        }
        var w = Math.max(Math.abs(ex), Math.abs(ey)); fin += w;
        if (w <= P.tolMM) ok++;
      }
      cells.push({ x: x, y: y, p: ok / trials, fin: fin / trials });
    }
    return cells;
  }

  root.MALIGN = { HEADS: HEADS, rng: rng, pchip: pchip, buildModel: buildModel, measure: measure, estimate: estimate,
                  runOnce: runOnce, batch: batch, captureMap: captureMap, wilson: wilson, CORNERS: CORNERS, frame: frame };
  if (typeof module !== 'undefined') module.exports = root.MALIGN;
})(typeof window !== 'undefined' ? window : globalThis);

<script>/* HISTORY ESTIMATOR: 5 SENSOR READINGS + COMMANDED MOVEMENTS ONLY. Cached separable PCHIP. */
(function(root){'use strict';
 function estimate(M,hist,P,fallback){
   if(hist.length<2)return fallback();
   var x0=hist[0].ox,y0=hist[0].oy,travel=0;
   for(var q=1;q<hist.length;q++)travel=Math.max(travel,Math.hypot(hist[q].ox-x0,hist[q].oy-y0));
   if(!(travel>1e-9))return fallback(); // no distinct observation positions
   var N=M.N,S=M.S,R=M.R,w=P.useHead,n=hist.length,lim=Math.round(P.searchMM/S),c0=Math.round(R/S);
   var sum=new Float64Array(5),ss=new Float64Array(5);
   var fx=[],fy=[],haveX=new Uint8Array(N),haveY=new Uint8Array(N);
   for(var k=0;k<n;k++){
     var xx=[],yy=[];
     for(var h=0;h<5;h++){xx.push(new Float64Array(N));yy.push(new Float64Array(N));}
     fx.push(xx);fy.push(yy);
   }
   function prepX(i){if(haveX[i])return;var x=-R+i*S;
     for(var k=0;k<n;k++)for(var h=0;h<5;h++)if(w[h])fx[k][h][i]=M.fx[h](x+hist[k].ox);
     haveX[i]=1;
   }
   function prepY(j){if(haveY[j])return;var y=-R+j*S;
     for(var k=0;k<n;k++)for(var h=0;h<5;h++)if(w[h])fy[k][h][j]=M.fy[h](y+hist[k].oy);
     haveY[j]=1;
   }
   function score(i,j){
     var x=-R+i*S,y=-R+j*S;
     sum.fill(0);ss.fill(0);
     for(var k=0;k<n;k++){
       var ob=hist[k],px=x+ob.ox,py=y+ob.oy;
       for(var h=0;h<5;h++)if(w[h]){
         var predicted=fx[k][h][i]+fy[k][h][j]+M.cxy[h]*px*py;
         var v=ob.m[h]-predicted;sum[h]+=v;ss[h]+=v*v;
       }
     }
     var c=0;for(var h=0;h<5;h++)if(w[h])c+=Math.max(0,ss[h]-sum[h]*sum[h]/n);
     return c;
   }
   var best=Infinity,bi=c0,bj=c0,step=4;
   for(var i=c0-lim;i<=c0+lim;i+=step)prepX(i);
   for(var j=c0-lim;j<=c0+lim;j+=step)prepY(j);
   for(var i=c0-lim;i<=c0+lim;i+=step)for(var j=c0-lim;j<=c0+lim;j+=step){
     var c=score(i,j);if(c<best){best=c;bi=i;bj=j;}
   }
   var fi=bi,fj=bj;
   for(var i=bi-5;i<=bi+5;i++)if(i>=0&&i<N)prepX(i);
   for(var j=bj-5;j<=bj+5;j++)if(j>=0&&j<N)prepY(j);
   for(var i=bi-5;i<=bi+5;i++)for(var j=bj-5;j<=bj+5;j++){
     if(i<0||j<0||i>=N||j>=N)continue;
     var c=score(i,j);if(c<best){best=c;fi=i;fj=j;}
   }
   if(!Number.isFinite(best))return fallback();
   return {x:-R+fi*S,y:-R+fj*S,rss:best,historyUsed:n};
 }
 root.MALIGN_HISTORY={estimate:estimate};
})(typeof window!=='undefined'?window:globalThis);

// ---------------- alignment with the kit (v3.5.4 engine, rule control + lowering interlock) ----------------
function rigid(est){ let sx = 0, sy = 0, num = 0, den = 0; for (const v of est){ sx += v[0]; sy += v[1]; } sx /= 4; sy /= 4;
  est.forEach((v, k) => { const X = CORNERS[k][0] * 1000, Y = CORNERS[k][1] * 1000; num += X * (v[1] - sy) - Y * (v[0] - sx); den += X * X + Y * Y; }); return [sx, sy, num / den]; }
async function alignAndLock(P, seed){
  const rnd = E.rng(seed);
  // remaining error after the machine's own coarse approach (same draws as the v3.5.4 simulator)
  const r0 = P.R0 * Math.sqrt(rnd()), a0 = 2 * Math.PI * rnd();
  truth.tx = r0 * Math.cos(a0); truth.ty = r0 * Math.sin(a0); truth.th = P.theta0 * Math.PI / 180 * rnd.n();
  const st = [];
  for (let k = 0; k < 4; k++){ truth.tol[k] = [P.tolC * rnd.n(), P.tolC * rnd.n()];
    const b = []; for (let h = 0; h < 5; h++) b.push(P.modelBias * rnd.n());
    st.push({dz: P.gapSd * rnd.n(), pitch: P.tiltSd * rnd.n(), roll: P.tiltSd * rnd.n(), bias: b}); }
  await tween(900, e => { sp.align = e; sp.h = TRAVEL + (HOVER - TRAVEL) * e; });   // settle just above the roof
  stage('3 · 센싱 범위 진입', `기계 자체 센서로 ±30 mm 안에 도착 · 실제 최악 코너 ${worstTruth().toFixed(2)} mm`);
  log('기계', '컨테이너 위 도착 · 키트 센싱 범위(±30 mm) 진입');
  const hist = [[], [], [], []], meas = [0, 0, 0, 0, 0];
  let round = 0, verify = false;
  while (true){
    if (!verify) round++;
    stage(`4 · 키트 센싱 ${round}회차${verify ? ' (최종 확인)' : ''}`);
    await sleep(450);
    const Eg = truthErrs(), est = [], grades = [];
    for (let k = 0; k < 4; k++){
      const f = E.frame(k, true), lx = f[0] * Eg[k][0], ly = f[1] * Eg[k][1];
      E.measure(MODEL, st[k], lx, ly, rnd, P, meas);
      hist[k].push({m: meas.slice(), ox: 0, oy: 0});
      const es = hist[k].length >= 2 ? HIST.estimate(MODEL, hist[k], P, () => E.estimate(MODEL, meas, P)) : E.estimate(MODEL, meas, P);
      est.push([f[0] * es.x, f[1] * es.y]); grades.push(`X ${(f[0] * es.x).toFixed(1)} · Y ${(f[1] * es.y).toFixed(1)}`);
    }
    showCorners(grades);
    const worstEst = Math.max(...est.map(v => Math.max(Math.abs(v[0]), Math.abs(v[1]))));
    log('키트', `${round}회차 센싱: 4코너 추정 최악 ${worstEst.toFixed(2)} mm`);
    const [sx, sy, dth] = rigid(est), K = P.K;
    const mv = [K * sx, K * sy, K * dth];
    const pred = est.map(([x, y], k) => { const X = CORNERS[k][0] * 1000, Y = CORNERS[k][1] * 1000; return Math.max(Math.abs(x - (mv[0] - mv[2] * Y)), Math.abs(y - (mv[1] + mv[2] * X))); });
    const predWorst = Math.max(...pred), converged = worstEst <= P.stopMM;
    let action;
    if (converged) action = 'lower';
    else if (verify) action = predWorst <= 4 ? 'lower' : 'stop';
    else if (round >= P.iters){ action = 'verify'; }
    else action = 'move';
    if (action === 'stop'){ log('서버', `최종 확인: 예상 최악 코너 ${predWorst.toFixed(2)} mm > 4 mm → 하강 금지, 안전 정지`); return 'held'; }
    // correction move (actuator error included)
    stage(`5 · 보정 이동 ${round}회차`, `X ${mv[0].toFixed(2)} mm · Y ${mv[1].toFixed(2)} mm · θ ${(mv[2] * 180 / Math.PI).toFixed(4)}°`);
    log('서버', `보정 지시: X ${mv[0].toFixed(2)} / Y ${mv[1].toFixed(2)} mm / θ ${(mv[2] * 180 / Math.PI).toFixed(4)}°`);
    const t0 = {...truth}, nx = truth.tx - (mv[0] + P.act * rnd.n()), ny = truth.ty - (mv[1] + P.act * rnd.n()), nth = truth.th - mv[2];
    await tween(800, e => { truth.tx = t0.tx + (nx - t0.tx) * e; truth.ty = t0.ty + (ny - t0.ty) * e; truth.th = t0.th + (nth - t0.th) * e; showCorners(grades); });
    for (let k = 0; k < 4; k++){ const lf = E.frame(k, true), X = CORNERS[k][0] * 1000, Y = CORNERS[k][1] * 1000;
      const deX = lf[0] * (-mv[0] + mv[2] * Y), deY = lf[1] * (-mv[1] - mv[2] * X);
      for (const o of hist[k]){ o.ox -= deX; o.oy -= deY; } }
    if (action === 'lower') break;
    if (action === 'verify'){ verify = true; log('서버', `${P.iters}회 보정 완료 → 최종 확인 센싱`); }
  }
  // lower and lock
  stage('6 · 하강'); log('서버', '하강 조건 충족 → 하강');
  await tween(800, e => { sp.h = HOVER + (SEAT - HOVER) * e; });
  const ok = worstTruth() <= P.tolMM;
  stage(ok ? '7 · 결합 (트위스트록 잠금)' : '7 · 결합 실패');
  setLockColor(ok ? 0x3ddc97 : 0xff5d5d);
  await tween(500, e => { for (const l of locks) l.g.rotation.y = ok ? e * Math.PI / 2 : 0; });
  log('기계', ok ? `결합 성공 (실제 최악 코너 ${worstTruth().toFixed(2)} mm)` : `결합 실패: 실제 최악 코너 ${worstTruth().toFixed(2)} mm > 5 mm`);
  return ok ? 'success' : 'false_lower';
}
function worstTruth(){ return Math.max(...truthErrs().map(v => Math.max(Math.abs(v[0]), Math.abs(v[1])))); }

// ---------------- the job: "move the container here" ----------------
let busy = false, jobs = 0;
async function moveContainer(target){
  busy = true; jobs++; banner(null); $('rotL').disabled = $('rotR').disabled = true;
  targetMark.visible = true; targetMark.position.set(target.x, .03, target.z); targetMark.rotation.y = target.yaw;
  const P = {...BASEP, ...PRESETS[$('hardware').value], estimator: 'history'};
  const seed = $('seed').value.trim() ? (Number($('seed').value) + jobs - 1) >>> 0 : (Math.random() * 4294967296) >>> 0;
  log('사용자', `컨테이너를 (${target.x.toFixed(1)}, ${target.z.toFixed(1)}) m, 방향 ${Math.round(target.yaw * 180 / Math.PI)}°로 옮기라고 지시`);
  sp.align = 0; truth.tx = truth.ty = truth.th = 0; truth.tol = [[0, 0], [0, 0], [0, 0], [0, 0]]; setLockColor(0x9aa3a8);
  for (const l of locks) l.g.rotation.y = 0;
  stage('1·2 · 컨테이너로 접근', '원거리에서 받은 컨테이너 대략 위치로 이동'); log('서버', '리치스태커 → 컨테이너로 접근');
  await goDock(cpose);
  let result = await alignAndLock(P, seed);
  if (result !== 'success'){
    const h0 = sp.h; await tween(900, e => { sp.h = h0 + (TRAVEL - h0) * e; });   // back up to travel height
    setLockColor(0x9aa3a8); for (const l of locks) l.g.rotation.y = 0;
    banner(result === 'held' ? '안전 정지 · 하강하지 않음 (다시 지시하면 재시도)' : '결합 실패 · 다시 지시하면 재시도', result === 'held' ? '#ffc04ddd' : '#ff5d5ddd');
    stage(result === 'held' ? '안전 정지' : '결합 실패', '목적지를 다시 클릭하면 재시도합니다');
    targetMark.visible = false; busy = false; $('rotL').disabled = $('rotR').disabled = false; return;
  }
  // lift and carry
  stage('8 · 들어 올림'); sp.carry = true;
  await tween(1100, e => { sp.lift = 2.2 * e; });
  stage('9 · 목적지로 운반', '컨테이너를 문 채 이동'); log('서버', '목적지로 운반');
  sp.align = 0;      // the container now hangs from the spreader: no relative offset
  truth.tx = truth.ty = truth.th = 0; truth.tol = [[0, 0], [0, 0], [0, 0], [0, 0]];
  const goal = {x: target.x, z: target.z, yaw: target.yaw};
  await goDock(goal);
  stage('10 · 내려놓기'); log('서버', '목적지에 내려놓음 → 트위스트록 해제');
  await tween(1100, e => { sp.lift = 2.2 * (1 - e); });
  await tween(450, e => { for (const l of locks) l.g.rotation.y = (1 - e) * Math.PI / 2; });
  setLockColor(0x9aa3a8); sp.carry = false;
  Object.assign(cpose, goal); container.position.set(goal.x, 0, goal.z); container.rotation.y = goal.yaw;
  await tween(900, e => { sp.h = SEAT + (TRAVEL - SEAT) * e; });
  const [bx, bz] = rot(spose.yaw, 0, -4); await driveTo(spose.x + bx, spose.z + bz);
  stage('완료', '다른 곳을 클릭하면 다시 옮깁니다'); banner('이동 완료', '#3ddc97dd'); log('서버', '작업 완료');
  targetMark.visible = false; busy = false; $('rotL').disabled = $('rotR').disabled = false;
}

// ---------------- pointer: ghost follows, click = "move it here" ----------------
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2(), plane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0), hit = new THREE.Vector3();
let down = null, ghostOk = false;
function pick(ev){ const r = canvas.getBoundingClientRect(); ndc.set(((ev.clientX - r.left) / r.width) * 2 - 1, -((ev.clientY - r.top) / r.height) * 2 + 1);
  ray.setFromCamera(ndc, camera); return ray.ray.intersectPlane(plane, hit) ? hit.clone() : null; }
function updateGhost(p){
  if (!p){ ghost.visible = false; return; }
  ghost.visible = !busy; ghost.position.set(p.x, 0, p.z); ghost.rotation.y = ghostYaw;
  const far = Math.hypot(p.x - cpose.x, p.z - cpose.z) > 7.5, inYard = Math.abs(p.x) < 42 && Math.abs(p.z) < 42;
  ghostOk = far && inYard;
  ghostMat.color.set(ghostOk ? 0x46c7ff : 0xff5d5d); ring.material.color.set(ghostOk ? 0x46c7ff : 0xff5d5d);
}
canvas.addEventListener('pointermove', ev => { if (!busy) updateGhost(pick(ev)); });
canvas.addEventListener('pointerdown', ev => { down = {x: ev.clientX, y: ev.clientY}; });
canvas.addEventListener('pointerup', ev => {
  if (!down || ev.button !== 0) return; const moved = Math.hypot(ev.clientX - down.x, ev.clientY - down.y); down = null;
  if (moved > 6 || busy) return;
  const p = pick(ev); updateGhost(p);
  if (!p) return;
  if (!ghostOk){ stage('여기는 안 돼요', '지금 컨테이너와 겹치거나 야드(노란 선) 밖입니다'); return; }
  ghost.visible = false; moveContainer({x: p.x, z: p.z, yaw: ghostYaw});
});
function rotateGhost(d){ ghostYaw += d; ghost.rotation.y = ghostYaw; }
window.addEventListener('keydown', ev => { if (busy) return; if (ev.key === 'r' || ev.key === 'R') rotateGhost(Math.PI / 12); if (ev.key === 'e' || ev.key === 'E') rotateGhost(-Math.PI / 12); });
$('rotL').addEventListener('click', () => rotateGhost(Math.PI / 12));
$('rotR').addEventListener('click', () => rotateGhost(-Math.PI / 12));
$('camAll').addEventListener('click', () => { camGoal = {pos: HOME.pos.clone(), look: HOME.look.clone()}; });
$('camNear').addEventListener('click', () => {   // from the side opposite the machine, looking at the container roof
  const c = container.position, yaw = container.rotation.y, [ox, oz] = rot(yaw, 4.5, 8.5);
  camGoal = {pos: new THREE.Vector3(c.x + ox, c.y + H + 4.2, c.z + oz), look: new THREE.Vector3(c.x, c.y + H + .8, c.z)}; });
let camGoal = null;

function resize(){ const w = window.innerWidth, h = window.innerHeight; renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix(); }
window.addEventListener('resize', resize); resize();
let last = performance.now();
function loop(now){
  const dt = Math.min(.1, (now - last) / 1000); last = now;
  placeScene();
  if (camGoal){ camera.position.lerp(camGoal.pos, 1 - Math.pow(.02, dt)); controls.target.lerp(camGoal.look, 1 - Math.pow(.02, dt)); if (camera.position.distanceTo(camGoal.pos) < .05) camGoal = null; }
  if ($('follow').checked) controls.target.lerp(spreader.position, .06);
  controls.update(); renderer.render(scene, camera); requestAnimationFrame(loop);
}
showCorners(); requestAnimationFrame(loop);
stage('대기', '반투명 컨테이너를 원하는 곳에 두고 클릭하세요 (R/E 또는 ⟲⟳ 로 방향)');
log('서버', '준비 완료 · 컨테이너 1개, 리치스태커 1대');
window.MALIGN_MOVE = {moveContainer, state: () => ({busy, cpose: {...cpose}, spose: {...spose}, truthWorst: worstTruth(), jobs,
  spreader: {x: spreader.position.x, y: spreader.position.y, z: spreader.position.z, yaw: spreader.rotation.y},
  container: {x: container.position.x, y: container.position.y, z: container.position.z, yaw: container.rotation.y}})};

</script>
